<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>A Special Surprise</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="mobile-container">
    
    <!-- SCREEN 1: INTRO & DOOR -->
    <section id="screen-intro" class="screen active">
      <div class="intro-content">
        <p class="subtitle">Someone made this just for you</p>
        <h1 class="main-title">A Special Museum</h1>
        <p class="instruction">Knock 3 times to enter</p>

        <div class="door-frame" id="door">
          <div class="door-inner">
            <div class="knock-target" id="knockBtn">
              <span class="knock-ring"></span>
            </div>
          </div>
        </div>

        <p class="counter-text" id="knockCountText">Knocks: 0 / 3</p>
      </div>
    </section>

    <!-- SCREEN 2: SCRATCH CARD GALLERY -->
    <section id="screen-gallery" class="screen">
      <div class="gallery-content">
        <p class="room-tag">Room 1 • The Gallery</p>
        <h2 class="room-title">Scratch to see it</h2>
        <p class="room-sub">Rub your finger across to reveal</p>

        <!-- Scratch Card Box -->
        <div class="scratch-card-wrapper">
          <!-- Peeche wali photo (Abhi demo image hai, baad me badal sakte hain) -->
          <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=600&auto=format&fit=crop" 
               alt="Memory Photo" 
               id="scratchImage" 
               class="secret-photo">
          
          <!-- Upar ka golden scratch canvas -->
          <canvas id="scratchCanvas" width="280" height="340"></canvas>
        </div>

        <!-- Next Room Button (Scratch complete hone par dikhega) -->
        <button id="nextRoomBtn" class="btn-primary" style="display: none;">
          Keep walking →
        </button>
      </div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
